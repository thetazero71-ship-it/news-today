# ==============================================================================
# Deploy to InfinityFree (or any shared FTP hosting) on every push to main.
#
# Required GitHub Secrets (Repo → Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftpupload.net  (from the hosting panel → FTP Details)
#   FTP_USERNAME  e.g. epiz_XXXXXX
#   FTP_PASSWORD  your hosting/FTP password
#   FTP_SERVER_DIR  e.g. /htdocs/  (or /your-domain.com/htdocs/ for addon domains)
#
# Notes:
#   - Only changed files are uploaded (differential sync).
#   - Server-side files are NEVER deleted (safe for uploads/ + hosting.php).
#   - config/hosting.php + uploads/* + runtime data are excluded below.
#   - Database schema changes are NOT deployed: apply them manually via phpMyAdmin.
# ==============================================================================

name: Deploy to InfinityFree

on:
  push:
    branches: [main]

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: false

jobs:
  lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint all PHP files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  deploy:
    name: FTP deploy
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean up git and dev files before FTP upload
        run: |
          # keep the retired-file list: .github is removed right after this
          if [ -f .github/retired-files.txt ]; then
            cp .github/retired-files.txt "$RUNNER_TEMP/retired-files.txt"
          fi
          rm -rf .git
          rm -rf .github
          rm -rf docs
          rm -rf scratch
          rm -rf storage/logs/*
          rm -rf storage/sessions/*
          rm -rf storage/cache/*

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftp
          exclude: |
            **/.git/**
            **/.git*
            .git/**
            .git*
            **/.github/**
            .github/**
            .env*
            config/hosting.php
            check_db.php
            dev-router.php
            router_local.php
            run-windows.bat
            run-windows.ps1
            run.sh
            run.txt
            *.md
            **/*.md
            *.txt
            **/*.txt
            tech_concept_preview.html
            tech_sources.txt
            1300
            *.sql
            **/*.sql
            *.zip
            **/*.zip
            tech_platform_*.json
            storage/logs/**
            storage/sessions/**
            storage/cache/**
            storage/cron_status.json
            scratch/**
            uploads/**
            docs/**

      - name: Delete retired files from the server
        # An FTP upload never removes files, so anything deleted from git would
        # stay live forever. The list is explicit and reviewed in the repo.
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -uo pipefail
          LIST="$RUNNER_TEMP/retired-files.txt"
          if [ ! -f "$LIST" ]; then
            echo "no retired file list"; exit 0
          fi
          # Some shared hosts refuse FTP deletes. In that case the file is
          # neutralised with a harmless stub so it can never expose anything.
          STUB="$RUNNER_TEMP/retired_stub.php"
          printf '%s\n' '<?php http_response_code(404); header("Content-Type: text/plain; charset=utf-8"); exit;' > "$STUB"
          failed=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              ''|\#*) continue ;;
            esac
            target="${FTP_SERVER_DIR%/}/${line}"
            echo "retire: $target"
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              -Q "DELE ${target}" \
              "ftp://${FTP_SERVER}/" || echo "000")
            case "$code" in
              2*|250)
                echo "  deleted" ;;
              5*)
                echo "  delete refused (${code}) -> neutralising with stub"
                up=$(curl -s -o /dev/null -w '%{http_code}' \
                  --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
                  -T "$STUB" \
                  "ftp://${FTP_SERVER}/${target}" || echo "000")
                case "$up" in
                  2*|250) echo "  stub uploaded" ;;
                  *) echo "  STUB UPLOAD FAILED (${up})"; failed=1 ;;
                esac ;;
              *)
                echo "  unexpected response ${code}"; failed=1 ;;
            esac
          done < "$LIST"
          exit $failed
