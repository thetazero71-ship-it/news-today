name: Auto-fetch news

on:
  schedule:
    # every 30 minutes
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Source ids separated by commas (empty = automatic selection)'
        required: false
        type: string

concurrency:
  group: news-auto-fetch
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch RSS feeds
    runs-on: ubuntu-latest
    steps:
      - name: Run one fetch cycle
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SOURCE_IDS: ${{ github.event.inputs.sources }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "SITE_URL / CRON_SECRET secret is missing - skipping"
            exit 0
          fi

          url="${SITE_URL%/}/cron/rss_auto_publish.php?secret=${CRON_SECRET}&max_sources=12"
          if [ -n "${SOURCE_IDS:-}" ]; then
            url="${url}&sources=${SOURCE_IDS}"
          fi

          echo "GET ${url%%secret=*}secret=***"
          code=$(curl -sS -o /tmp/fetch.log -w '%{http_code}' --max-time 120 "$url" || echo 000)
          echo "HTTP ${code}"
          tail -n 25 /tmp/fetch.log || true

          if [ "$code" != "200" ]; then
            echo "::warning::fetch cycle returned HTTP ${code}"
          fi